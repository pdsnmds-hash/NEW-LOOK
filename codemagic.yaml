# Copy this file to codemagic.yaml in the repository root.
# Also commit docs/codemagic/prepare_signing.py and verify_aab.py.
workflows:
  newlook-aab:
    name: NEW LOOK - Signed AAB
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
      android_signing:
        - newlook_upload
    scripts:
      - name: Configure Android SDK 37
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          python3 docs/codemagic/configure_sdk.py
      - name: Prepare uploaded signing key for existing Gradle config
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          python3 docs/codemagic/prepare_signing.py
      - name: Build signed release AAB
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:bundleRelease
      - name: Verify AAB signature and native ABI
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          python3 docs/codemagic/verify_aab.py app/build/outputs/bundle/release/app-release.aab
    artifacts:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/mapping/release/mapping.txt
      - app/build/reports/lint-results-debug.html
      - app/build/reports/tests/testDebugUnitTest/**
